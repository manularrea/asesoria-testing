# Despliegue continuo de AsesorIA Planes (Unidad 4): E2E con pasarela simulada → Vercel (producción) → smoke en la URL pública.
# Secretos: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Variables de Stripe se configuran en el proyecto de Vercel.
name: deploy-planes

on:
  push:
    branches: [main]
    paths: ["asesoria-planes/**", ".github/workflows/deploy-planes.yml"]
  pull_request:
    paths: ["asesoria-planes/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: asesoria-planes

jobs:
  e2e:
    name: Build + E2E (Playwright, pasarela mock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asesoria-planes/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint && npx tsc --noEmit
      - name: Build (proveedor mock)
        run: npm run build
        env: { PAYMENTS_PROVIDER: mock }
      - name: Pruebas E2E (12 casos del plan TestSprite)
        run: npx playwright test
        env: { PAYMENTS_PROVIDER: mock, CI: "true" }
      - name: Resumen
        if: always()
        run: |
          echo "### E2E AsesorIA Planes" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./test-results/results.json");const s=r.stats;console.log(`| Pasaron | Fallaron | Omitidas | Duración |\n|---|---|---|---|\n| ${s.expected} | ${s.unexpected} | ${s.skipped} | ${(s.duration/1000).toFixed(1)} s |`)' >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f test-results/healing-log.json ]; then { echo; echo "Curaciones de localizadores:"; echo '```'; cat test-results/healing-log.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "asesoria-planes/playwright-report\nasesoria-planes/test-results" }

  deploy:
    name: Deploy a Vercel (producción)
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 15
    environment: { name: production, url: "${{ steps.deploy.outputs.url }}" }
    outputs: { url: "${{ steps.deploy.outputs.url }}" }
    # El proyecto de Vercel tiene Root Directory = asesoria-planes, por lo que la CLI debe ejecutarse
    # desde la raíz del repositorio (no desde el working-directory por defecto) para no duplicar la ruta.
    defaults: { run: { working-directory: . } }
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - run: echo "Desplegado en ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  smoke-prod:
    name: Smoke en producción (Stripe modo test)
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asesoria-planes/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Health + catálogo + API contra la URL pública
        run: |
          curl -fsS "${{ needs.deploy.outputs.url }}/api/health"
          BASE_URL="${{ needs.deploy.outputs.url }}" npx playwright test tests/e2e/api.spec.ts tests/e2e/catalogo.spec.ts
