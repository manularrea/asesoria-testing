# Configuración de SonarCloud para el monorepo AsesorIA (Java + Python).
# Reemplazar organization/projectKey por los de tu cuenta de SonarCloud.
sonar.organization=mlarrea
sonar.projectKey=mlarrea_asesoria-testing
sonar.projectName=AsesorIA - Testing (TDD + BDD)
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Fuentes de producción y de pruebas
sonar.sources=guardrail-service/src/main/java,sut/app
sonar.tests=guardrail-service/src/test/java,sut/tests,tests-e2e/src/test/java
sonar.exclusions=**/static/**,**/templates/**,**/node_modules/**

# Java
sonar.java.source=17
sonar.java.binaries=guardrail-service/target/classes
sonar.java.test.binaries=guardrail-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=guardrail-service/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=guardrail-service/target/surefire-reports

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=sut/coverage.xml
sonar.python.xunit.reportPath=sut/pytest-report.xml

# Quality gate: se usa "Sonar way" (código nuevo: cobertura >= 80 %, duplicación <= 3 %, ratings A)
# Las alertas aceptadas como falsos positivos se documentan en el informe (sección de métricas).
