{% extends "base.html" %}
{% block title %}Iniciar sesión · AsesorIA{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Iniciar sesión</h1>
  <p class="muted">Acceso para asesores de la entidad.</p>
  {% if error %}
  <div class="alert" role="alert" data-testid="login-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" data-testid="login-form">
    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" autocomplete="username" required
           value="{{ username or '' }}" data-testid="login-username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           data-testid="login-password">
    <button type="submit" class="primary" data-testid="login-submit">Ingresar</button>
  </form>
</section>
{% endblock %}
